# docker-compose.yml
# MySQL만 컨테이너로 띄우는 용도입니다 (백엔드/프론트는 아직 그대로 로컬에서 npm/uvicorn으로 실행).
# 로컬에 MySQL을 직접 설치하지 않고, 이 파일 하나로 "설치 없이 MySQL 켜기"만 해결합니다.
#
# 사용법:
#   1) 이 파일을 .env 파일과 같은 위치(보통 backend/ 폴더)에 둡니다.
#      (.env가 다른 위치에 있다면 아래 env_file 경로만 맞게 고쳐주세요)
#   2) docker compose up -d       ← MySQL 켜기
#   3) docker compose down        ← MySQL 끄기 (데이터는 유지됨)
#   4) docker compose down -v     ← MySQL 끄고 데이터까지 완전 삭제하고 싶을 때만

services:
  mysql:
    image: mysql:8
    container_name: remedi-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env의 DB_PASSWORD/DB_USER/DB_NAME 값을 그대로 재사용합니다.
      # (.env에 값이 없으면 :- 뒤의 기본값이 쓰입니다)
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-remedi_root_pw}
      MYSQL_DATABASE: ${DB_NAME:-healthcare_db}
      MYSQL_USER: ${DB_USER:-remedi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-remedi_root_pw}
    ports:
      # .env의 DB_PORT를 그대로 씁니다. 로컬에 이미 MySQL이 설치되어 있어서
      # 3306이 겹치면, .env의 DB_PORT를 예: 3307로 바꾸면 됩니다.
      - "${DB_PORT:-3306}:3306"
    volumes:
      - remedi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  remedi_mysql_data:
    # 컨테이너를 껐다 켜도 데이터가 유지되도록 별도 볼륨에 저장합니다.
    # "docker compose down -v"를 하기 전까지는 데이터가 사라지지 않습니다.
