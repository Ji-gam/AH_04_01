# 드롭 폴더 튜닝 — **선택적이다.**
#
# 이 파일이 없어도 `source/`의 파일은 전부 색인된다. 여기엔 기계가 알 수 없는 것만 적는다.
# 기계가 아는 건 안 적는다:  로더=확장자,  컬렉션=확장자,  RAG 여부=이 폴더에 있냐
#
# **새 파일 추가 = 폴더에 넣기.** 아래는 손 안 대도 된다.

# ── 본문에서 뺄 컬럼 ──────────────────────────────────────────────────────────
# 기본은 전 컬럼이 본문이다. 사람이 안 읽는 것(일련번호·코드·날짜·플래그·URL)만 뺀다.
#
# 화이트리스트("넣을 컬럼"을 적는 방식)를 쓰지 않는 이유: 실수하면 데이터가 소리 없이
# 사라진다. 실제로 예전 화이트리스트는 7개 DUR 파일 **전부**에서 FORM_NAME(제형명)과
# REMARK(비고)를 버리고 있었다 — 둘 다 사람이 읽는 말인데. 블랙리스트는 실수해도
# 노이즈가 조금 늘 뿐이다.
#
# 전역 하나로 14개 파일이 다 커버된다: 컬럼명이 파일끼리 겹치지 않는다
# (DUR_SEQ는 drugs_data에 없고 itemSeq는 DUR에 없다).
exclude_columns:
  # DUR 7개 공통
  - DUR_SEQ # 일련번호
  - INGR_CODE # 성분 코드
  - MIX_TYPE # 단일/복합 구분 코드
  - EFFECT_CODE # 효능군 코드
  - NOTIFICATION_DATE # 고시일자
  - DEL_YN # 삭제 플래그
  # 병용금기(dur_usjnt_taboo)의 상대 성분 쪽
  - MIXTURE_INGR_CODE
  - MIXTURE_MIX_TYPE
  # e약은요(drugs_data)
  - itemSeq
  - openDe
  - updateDe
  - itemImage # 이미지 URL
  - bizrno # 사업자번호
  # 논문 JSON — 메타데이터로만 쓴다
  - pmid

# ── 메타데이터로 챙길 컬럼 ────────────────────────────────────────────────────
# {원본 컬럼: 메타데이터 키}. 전역이라 그 컬럼이 없는 파일은 그냥 건너뛴다.
#
# 여기 이름이 틀리면 검색이 통째로 죽는다 — 두 검색 함수 다 **항상** 필터를 걸기 때문:
#   retrieve_service.search_documents()    -> {"ingr_name": X}  없으면 DUR 검색 0건
#   paper_retrieve_service.search_papers() -> {"disease": X}    (아래 metadata에서 붙는다)
metadata_columns:
  INGR_NAME: ingr_name
  INGR_KOR_NAME: ingr_name # 병용금기만 컬럼명이 이렇다. 같은 키로 흡수한다.
  itemSeq: item_seq
  itemName: item_name
  pmid: pmid

# ── 파일 이름표 ───────────────────────────────────────────────────────────────
# 파일을 열어봐도 알 수 없는 것만. 이 파일에서 나온 모든 문서에 붙는다.
metadata:
  # DUR (식약처) — 성분 단위 금기/주의 규칙
  dur_pwnm_taboo.csv: { display_name: 임부금기의약품, publisher: 식약처 }
  dur_odsn_atent.csv: { display_name: 노인주의의약품, publisher: 식약처 }
  dur_mdctn_pd_atent.csv: { display_name: 투여기간주의의약품, publisher: 식약처 }
  dur_efcy_dplct.csv: { display_name: 효능군중복의약품, publisher: 식약처 }
  dur_cpcty_atent.csv: { display_name: 용량주의의약품, publisher: 식약처 }
  dur_spcify_agrde_taboo.csv: { display_name: 특정연령금기의약품, publisher: 식약처 }
  dur_usjnt_taboo.csv: { display_name: 병용금기의약품, publisher: 식약처 }

  # 식약처 e약은요 — 사람이 소비자용으로 쓴 산문 7필드(효능/용법/경고/주의/상호작용/부작용/보관)
  drugs_data.csv: { display_name: e약은요, publisher: 식약처 }

  # PubMed 논문 — `disease`가 논문 검색의 필터 키다. 없으면 그 파일은 영영 안 뽑힌다.
  암.json: { display_name: PubMed 논문, disease: 암, source_name: PubMed }
  심장질환.json: { display_name: PubMed 논문, disease: 심장질환, source_name: PubMed }
  뇌혈관질환.json: { display_name: PubMed 논문, disease: 뇌혈관질환, source_name: PubMed }
  당뇨.json: { display_name: PubMed 논문, disease: 당뇨, source_name: PubMed }
  간질환.json: { display_name: PubMed 논문, disease: 간질환, source_name: PubMed }

  # 스캔본 PDF를 OCR+LLM으로 정리한 마크다운(ai_worker/scripts/ocr_pdf.py로 만들었다).
  # 사서는 요리를 안 하므로 원본 스캔 PDF는 드롭 폴더에 두지 않는다 — 글자 레이어가 없어
  # 그대로 넣으면 0건이 나온다. 이 .md가 곧 원본 취급이다(PDF는 레포에 없다).
  약과음식_복약안내서.md: { display_name: 약과 음식 상호작용을 피하는 복약안내서, publisher: 식약처, ocr: true }
