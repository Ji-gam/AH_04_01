# source/ 인제스천 매니페스트
#
# 이 폴더는 드롭 폴더다. 어떤 데이터든 여기 넣고, 그게 RAG 재료라면 아래에 블록을 하나
# 추가한다. 파이썬 코드는 건드리지 않는다.
#
# 여기 없는 파일은 색인되지 않지만 조용히 무시되지도 않는다 — /admin/ingest/status가
# "unregistered"로 보여준다. rag: false는 "봤고, 일부러 뺐다"는 뜻이며 reason에 이유를 남긴다.
#
# 필드:
#   file              source/ 안의 파일명 (필수)
#   loader            csv | json          (rag=true면 필수)
#   collection        Chroma 컬렉션 이름   (rag=true면 필수)
#   content_columns   임베딩될 본문에 넣을 컬럼(순서 유지). 생략 시 전체 컬럼.
#   metadata_columns  {원본 컬럼: 메타데이터 키}. 본문엔 안 넣고 필터/표시에만 쓴다.
#   metadata          이 파일의 모든 문서에 붙는 고정 메타데이터

version: 1

sources:
  # ---------------------------------------------------------------- DUR (식약처)
  # 예전엔 파일마다 전용 함수(_pwnm_content 등 7개)가 "의약품 성분 [X]는 Y입니다"라는
  # 우리가 발명한 한국어 문장을 만들었다. 파일 추가가 곧 코드 추가였다.
  # 이제 파일별 차이는 아래 컬럼 선언뿐이고 로더는 CsvRecordLoader 하나다.
  #
  # ingr_name 메타데이터는 retrieve_service가 성분명 필터로 쓴다(없으면 DUR 검색이 죽는다).
  - file: dur_pwnm_taboo.csv
    loader: csv
    collection: dur_rules
    content_columns: [INGR_NAME, INGR_ENG_NAME, TYPE_NAME, GRADE, PROHBT_CONTENT, CLASS_NAME]
    metadata_columns: { INGR_NAME: ingr_name }
    metadata: { display_name: 임부금기의약품, publisher: 식약처 }

  - file: dur_odsn_atent.csv
    loader: csv
    collection: dur_rules
    content_columns: [INGR_NAME, INGR_ENG_NAME, TYPE_NAME, PROHBT_CONTENT]
    metadata_columns: { INGR_NAME: ingr_name }
    metadata: { display_name: 노인주의의약품, publisher: 식약처 }

  - file: dur_mdctn_pd_atent.csv
    loader: csv
    collection: dur_rules
    content_columns: [INGR_NAME, INGR_ENG_NAME, TYPE_NAME, MAX_DOSAGE_TERM, PROHBT_CONTENT, CLASS_NAME]
    metadata_columns: { INGR_NAME: ingr_name }
    metadata: { display_name: 투여기간주의의약품, publisher: 식약처 }

  - file: dur_efcy_dplct.csv
    loader: csv
    collection: dur_rules
    content_columns: [INGR_NAME, INGR_ENG_NAME, TYPE_NAME, SERS_NAME, PROHBT_CONTENT, CLASS_NAME]
    metadata_columns: { INGR_NAME: ingr_name }
    metadata: { display_name: 효능군중복의약품, publisher: 식약처 }

  - file: dur_cpcty_atent.csv
    loader: csv
    collection: dur_rules
    content_columns: [INGR_NAME, INGR_ENG_NAME, TYPE_NAME, MAX_QTY, PROHBT_CONTENT, CLASS_NAME]
    metadata_columns: { INGR_NAME: ingr_name }
    metadata: { display_name: 용량주의의약품, publisher: 식약처 }

  - file: dur_spcify_agrde_taboo.csv
    loader: csv
    collection: dur_rules
    content_columns: [INGR_NAME, INGR_ENG_NAME, TYPE_NAME, AGE_BASE, PROHBT_CONTENT, CLASS_NAME]
    metadata_columns: { INGR_NAME: ingr_name }
    metadata: { display_name: 특정연령금기의약품, publisher: 식약처 }

  # 병용금기는 성분 두 개의 조합이라 컬럼 구성이 다르다(INGR_KOR_NAME + MIXTURE_*).
  # 예전엔 이 파일 때문에 11컬럼 복합키(id_fields)를 손으로 지정해야 했는데,
  # index()가 콘텐츠 해시로 키를 만들므로 그 기계장치가 통째로 필요 없어졌다.
  - file: dur_usjnt_taboo.csv
    loader: csv
    collection: dur_rules
    content_columns:
      [INGR_KOR_NAME, INGR_ENG_NAME, MIXTURE_INGR_KOR_NAME, MIXTURE_INGR_ENG_NAME, TYPE_NAME, PROHBT_CONTENT]
    metadata_columns: { INGR_KOR_NAME: ingr_name }
    metadata: { display_name: 병용금기의약품, publisher: 식약처 }

  # ---------------------------------------------------------------- RAG 제외
  # ITEM_SEQ 기반 구조화 조회 데이터. 사람이 읽는 산문이 아니라 표라서, 벡터 검색에 넣으면
  # 행끼리 서로 유사해 유사도가 변별력을 잃는다. 정확 조회(SQL) 대상이지 RAG 대상이 아니다.
  - { file: drug_identification.csv, rag: false, reason: 알약 식별(모양/색상) 구조화 데이터 }
  - { file: drug_bundle_info.csv, rag: false, reason: 위탁제조 매핑 테이블 }
  - { file: drug_max_dosage.csv, rag: false, reason: 성분별 최대투여량 수치 테이블 }
  - { file: drug_prdt_mcpn_detail.csv, rag: false, reason: 제품-성분 매핑 테이블 }
  - { file: drug_prdt_prmsn_detail.csv, rag: false, reason: 허가정보 구조화 데이터 }
  - { file: drug_prdt_prmsn_list.csv, rag: false, reason: 허가목록 구조화 데이터 }
  - { file: item_ingredient_map.csv, rag: false, reason: 제품-성분 조인 테이블 }
  - { file: medicine_recalls.csv, rag: false, reason: 회수/판매중지 구조화 데이터 }
  - { file: dur_prod_master_list.csv, rag: false, reason: DUR 제품 마스터 테이블 }
  - { file: dur_prod_cpcty_atent.csv, rag: false, reason: DUR 제품 단위 테이블(성분 단위는 dur_cpcty_atent) }
  - { file: dur_prod_efcy_dplct.csv, rag: false, reason: DUR 제품 단위 테이블 }
  - { file: dur_prod_mdctn_pd_atent.csv, rag: false, reason: DUR 제품 단위 테이블 }
  - { file: dur_prod_odsn_atent.csv, rag: false, reason: DUR 제품 단위 테이블 }
  - { file: dur_prod_pwnm_taboo.csv, rag: false, reason: DUR 제품 단위 테이블 }
  - { file: dur_prod_seobang_partition.csv, rag: false, reason: DUR 제품 단위 테이블 }
  - { file: dur_prod_spcify_agrde_taboo.csv, rag: false, reason: DUR 제품 단위 테이블 }
  - { file: dur_prod_usjnt_taboo.csv, rag: false, reason: DUR 제품 단위 테이블(632MB, git 제외) }
# 아직 등록하지 않은 것 (status에 "unregistered"로 뜬다):
#   drugs_data.csv        식약처 e약은요 — 자연어 산문 7필드. RAG 최우선 후보(다음 단계).
#   {질환}.json x5        PubMed 논문 — 논문 이관 단계에서 등록.
#   *.pdf x2              약물상호작용 가이드라인 — Docling 로더 도입 후 등록.
