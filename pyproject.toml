[project]
name = "ai-health-final"
version = "0.1.0"
description = "AI 헬스케어 파이널 프로젝트 예시용"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.3",
    "openai>=2.44.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "redis>=7.1.0",
    "tomlkit>=0.14.0",
]

[dependency-groups]
ai = [
    "langchain>=0.3.0",
    # langchain-community는 넣지 않는다: 2026-05-22 sunset, 06-19 아카이브(읽기 전용).
    # 거기 있던 CSVLoader/JSONLoader는 전용 패키지로 이관되지 않았고, LangChain의 공식
    # 안내가 "앱 코드에 직접 구현하라"이므로 core의 BaseLoader를 구현해 쓴다
    # (ai_worker/ingest/loaders.py). 죽은 패키지 위에 파이프라인을 세우지 않는다.
    # SQLRecordManager(인제스트 증분 판단용 장부)가 여기 있다. 예전엔
    # langchain-community를 통해 전이적으로 딸려왔는데, 그걸 걷어내며 끊겨서 명시한다.
    "langchain-classic>=1.0.0",
    "langchain-chroma>=0.1.0",
    "langchain-openai>=0.2.0",
    "fastapi[standard]>=0.128.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    # source/_manifest.yaml 파싱.
    "pyyaml>=6.0",
    # Phase 0 임베딩 벤치마크(2026-07-17) 결과로 기본 임베딩 프로바이더를 HF로 전환.
    # HF Inference API(호스팅, 텍스트당 개별 HTTP 요청)는 대량 재인제스트(5,700여 건)에
    # 비현실적으로 느려, 모델을 로컬로 내려받아 배치 인코딩하는 sentence-transformers로
    # 전환한다(CPU 전용 — 아래 [tool.uv.sources]의 pytorch-cpu 인덱스 사용).
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]
app = [
    "alembic>=1.14.0",
    "asyncmy>=0.2.11",
    "bcrypt<=4.0.1",
    "celery>=5.4.0",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "orjson>=3.11.5",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=11.0.0",
    "pyjwt>=2.10.1",
    "sqladmin>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2026.2",
    "uvicorn>=0.40.0",
]
dev = [
    "coverage>=7.13.2",
    "mypy>=1.19.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "types-passlib>=1.7.7.20250602",
    "types-python-dateutil>=2.9.0.20260124",
    "types-PyYAML>=6.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]

[tool.ruff]
# 기본 라인 길이 설정
line-length = 120
target-version = "py312"
# docs/dev/sample_code_* 는 팀원 참고용 예시 코드(실제 실행 대상 아님) — lint 대상에서 제외
extend-exclude = ["docs/dev/sample_code_chat", "docs/dev/sample_code_recog"]

[tool.ruff.lint]
# 사용할 린트 규칙들 선택
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["UP046", "E501"]

# 특정 파일에서 무시할 규칙들
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/core/validators/__init__.py" = ["F403"]
"app/core/db/migrations/**" = ["ALL"]

[tool.ruff.format]
# 포매터 설정
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
# docs/dev/sample_code_* 가 실제 app/ 패키지와 같은 이름("app")을 써서
# 전체 스캔 시 "Duplicate module named app" 오류로 mypy 자체가 멈춘다.
exclude = ["docs/dev/sample_code_chat", "docs/dev/sample_code_recog"]

[[tool.mypy.overrides]]
# celery는 타입 스텁(py.typed)을 제공하지 않는다.
module = ["celery", "celery.*"]
ignore_missing_imports = true
