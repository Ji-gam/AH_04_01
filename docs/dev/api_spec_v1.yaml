# 자동 생성 파일 — 직접 수정하지 말고 `python scripts/gen_api_docs.py`로 재생성하세요.
openapi: 3.1.0
info:
  title: ReMedi API v1
  summary: 복약·건강관리 서비스(ReMedi) 백엔드 API
  description: 'AH_04_01(ReMedi) 백엔드 전체 API 명세.


    - 생성 방식: FastAPI 앱(`app/main.py`)의 런타임 OpenAPI 스키마를 추출 — 코드가 유일한 진실.

    - 인증: JWT (`Authorization: Bearer <access_token>`), Access 30분 / Refresh 14일.

    - 도메인 데이터는 `user_id`가 아니라 `profile_id` 기준으로 스코핑한다.

    - 갱신: `python scripts/gen_api_docs.py` (엔드포인트 추가/변경 시 같은 PR에서 재생성).

    '
  version: 1.0.0
paths:
  /api/v1/auth/signup:
    post:
      tags:
      - auth
      summary: 이메일 회원가입
      description: User(계정)를 생성하고, 동시에 본인 Profile(relation=SELF)을 자동으로 생성한다.
      operationId: signup_api_v1_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '409':
          description: 이메일 또는 휴대폰 번호가 이미 사용 중
        '422':
          description: 비밀번호/생년월일/휴대폰번호 형식이 유효하지 않음
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: 로그인
      description: '이메일/비밀번호를 검증하고 JWT를 발급한다. Access Token은 응답 body로 오고, Refresh Token은 httpOnly 쿠키(Set-Cookie: refresh_token)로
        내려간다.'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 이메일 또는 비밀번호가 올바르지 않음
        '423':
          description: 비활성화된 계정
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/token/refresh:
    get:
      tags:
      - auth
      summary: 액세스 토큰 재발급
      description: 쿠키의 refresh_token으로 새 Access Token을 발급한다. 요청 본문은 없고, 쿠키만 있으면 된다. [로테이션] 이때 refresh_token 자체도 새 값으로 교체되고
        쿠키가 갱신된다 - 예전 refresh_token은 즉시 무효화되어 다시 쓸 수 없다. 이미 무효화된 토큰으로 재시도하면(탈취 의심) 그 계정의 모든 세션이 강제 로그아웃된다.
      operationId: token_refresh_api_v1_auth_token_refresh_get
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          description: refresh_token 쿠키가 없거나 만료/무효화됨
        '400':
          description: refresh_token이 유효하지 않음(위조/형식 오류)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 로그아웃
      description: refresh_token 쿠키를 무효화(revoke)하고 쿠키를 삭제한다. 쿠키가 없거나 이미 만료됐어도 항상 성공한다.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
  /api/v1/auth/withdraw:
    delete:
      tags:
      - auth
      summary: 회원탈퇴
      description: 본인 확인용 현재 비밀번호를 재확인한 뒤, User(계정)와 본인 Profile(개인정보)을 즉시 완전 삭제한다. 개인정보보호법상 탈퇴 시 지체없이 파기해야 하므로 소프트삭제가 아니라
        하드삭제이며, 되돌릴 수 없다.
      operationId: withdraw_api_v1_auth_withdraw_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '400':
          description: 비밀번호가 올바르지 않음
        '401':
          description: 토큰이 없거나 유효하지 않음
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/{provider}/login:
    get:
      tags:
      - auth
      summary: 소셜 로그인 시작
      description: '해당 provider의 동의 화면으로 리다이렉트한다. 지원 provider: google, kakao, naver.'
      operationId: social_login_api_v1_auth__provider__login_get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: 지원하지 않는 provider
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/{provider}/callback:
    get:
      tags:
      - auth
      summary: 소셜 로그인 콜백
      description: provider가 이 주소로 code를 담아 리다이렉트해온다. 기존 계정이면 로그인, 신규면 이 시점에 곧바로 계정을 생성한다(닉네임+이메일은 provider가 이미 주므로 별도 입력
        화면 없음). 처리 후 refresh_token 쿠키를 심고 FRONTEND_URL(홈)로 리다이렉트한다. 브라우저 리다이렉트로만 동작해서 Swagger에서는 직접 테스트할 수 없다.
      operationId: social_callback_api_v1_auth__provider__callback_get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: 지원하지 않는 provider
        '409':
          description: 이미 다른 방식(이메일 등)으로 가입된 이메일
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/stats:
    get:
      tags:
      - admin
      summary: 관리자 대시보드 통계 조회 (관리자 전용)
      description: 전체 가입자/관리자 수, 가입자 추이(기간 지정 가능), 항목별 동의자 수, 최근 24시간 오류 건수를 한 번에 조회.
      operationId: get_stats_api_v1_admin_stats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 90
          minimum: 1
          description: 가입자 추이 조회 기간(일). 기본 7일, 최대 90일.
          default: 7
          title: Days
        description: 가입자 추이 조회 기간(일). 기본 7일, 최대 90일.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/ops-stats:
    get:
      tags:
      - admin
      summary: 관리자 대시보드 운영 현황 조회 (관리자 전용)
      description: DAU/WAU, 근사 복약 순응도, 상위 약품(소수 인원 그룹 제외), 콘텐츠/챗봇/알림/가족연결/탈퇴 추이, AI-worker 상태를 한 번에 조회한다. 전부 익명 집계.
      operationId: get_ops_stats_api_v1_admin_ops_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsStatsResponse'
      security:
      - HTTPBearer: []
  /api/v1/admin/notices:
    get:
      tags:
      - admin
      summary: 공지 목록 조회 (관리자 전용)
      operationId: list_notices_admin_api_v1_admin_notices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdminNoticeResponse'
                type: array
                title: Response List Notices Admin Api V1 Admin Notices Get
      security:
      - HTTPBearer: []
  /api/v1/admin/notices/{notice_id}:
    patch:
      tags:
      - admin
      summary: 공지 수정 (관리자 전용)
      description: 보낸 필드만 갱신한다. 수정만 하고 재발송은 하지 않는다(이미 받은 사람에게 중복 알림 방지).
      operationId: update_notice_admin_api_v1_admin_notices__notice_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: notice_id
        in: path
        required: true
        schema:
          type: integer
          title: Notice Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNoticeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin
      summary: 공지 삭제 (관리자 전용)
      operationId: delete_notice_admin_api_v1_admin_notices__notice_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: notice_id
        in: path
        required: true
        schema:
          type: integer
          title: Notice Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/contents:
    get:
      tags:
      - admin
      summary: 건강 콘텐츠 목록 조회 (관리자 전용)
      operationId: list_contents_admin_api_v1_admin_contents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdminContentResponse'
                type: array
                title: Response List Contents Admin Api V1 Admin Contents Get
      security:
      - HTTPBearer: []
  /api/v1/admin/contents/{content_id}:
    patch:
      tags:
      - admin
      summary: 건강 콘텐츠 수정 (관리자 전용)
      description: 보낸 필드만 갱신한다. 질환/카테고리/날짜는 유니크 제약 키라 여기서 안 바꾼다.
      operationId: update_content_admin_api_v1_admin_contents__content_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: content_id
        in: path
        required: true
        schema:
          type: integer
          title: Content Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin
      summary: 건강 콘텐츠 삭제 (관리자 전용)
      operationId: delete_content_admin_api_v1_admin_contents__content_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: content_id
        in: path
        required: true
        schema:
          type: integer
          title: Content Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/error-logs:
    get:
      tags:
      - admin
      summary: 서버 오류 로그 조회 (관리자 전용, AI챗봇 제외)
      description: 챗봇 이외의 API에서 발생한 미처리 예외를 최신순 100건까지 조회한다. 전체 트레이스백/요청 바디는 저장하지 않으며, 예외 타입 + 200자로 잘라낸 메시지만 남는다.
      operationId: list_error_logs_api_v1_admin_error_logs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ErrorLogResponse'
                type: array
                title: Response List Error Logs Api V1 Admin Error Logs Get
      security:
      - HTTPBearer: []
  /api/v1/admin/users:
    get:
      tags:
      - admin
      summary: 사용자 목록 조회 (관리자 전용)
      description: 이메일 부분일치 검색 가능. 관리자 승격 대상을 찾는 용도라 최신 가입순 50건으로 제한.
      operationId: list_users_api_v1_admin_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 이메일 부분일치 검색
          title: Search
        description: 이메일 부분일치 검색
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserResponse'
                title: Response List Users Api V1 Admin Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/{user_id}/admin:
    patch:
      tags:
      - admin
      summary: 관리자 권한 승격/해제 (관리자 전용)
      description: 지정한 사용자의 is_admin을 켜거나 끈다. 이 행위는 admin_actions에 감사로그로 남는다. 새 공개 가입 경로(초대코드 등)를 만드는 대신, 이미 있는 관리자가 승격시키는
        방식만 지원한다 - 최초 관리자 1명은 서버에서 app/scripts/promote_admin.py로 지정한다.
      operationId: set_admin_api_v1_admin_users__user_id__admin_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAdminRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/actions:
    get:
      tags:
      - admin
      summary: 관리자 행위 감사로그 조회 (관리자 전용)
      description: 권한 승격/해제, 공지 발송 등 관리자 화면에서 이뤄진 행위를 최신순 100건까지 조회.
      operationId: list_actions_api_v1_admin_actions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdminActionResponse'
                type: array
                title: Response List Actions Api V1 Admin Actions Get
      security:
      - HTTPBearer: []
  /api/v1/users/me:
    get:
      tags:
      - users
      summary: 내 정보 조회
      description: 'Authorization: Bearer 토큰의 user_id/profile_id로 User(계정)와 본인 Profile을 합쳐서 반환한다.'
      operationId: user_me_info_api_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: 토큰이 없거나 유효하지 않음
      security:
      - HTTPBearer: []
    patch:
      tags:
      - users
      summary: 내 정보 수정
      description: 전달한 필드(name/phone_number/gender)만 부분 수정해서 Profile에 반영하고, User와 합친 최신 정보를 반환한다. email은 로그인 식별자라 여기서 수정할
        수 없다(가입 후 고정).
      operationId: update_user_me_info_api_v1_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: 토큰이 없거나 유효하지 않음
        '409':
          description: 변경하려는 휴대폰 번호가 이미 사용 중
        '422':
          description: 휴대폰번호 형식이 유효하지 않음
      security:
      - HTTPBearer: []
  /api/v1/users/me/health-info:
    get:
      tags:
      - users
      summary: 개인건강정보 조회
      description: 나이/성별/키/체중/진단병력/가족력/특이사항/기타를 조회한다. 키·체중이 둘 다 있으면 bmi를 계산해서 같이 내려준다(하나라도 없으면 null).
      operationId: get_health_info_api_v1_users_me_health_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthInfoResponse'
        '401':
          description: 토큰이 없거나 유효하지 않음
      security:
      - HTTPBearer: []
    patch:
      tags:
      - users
      summary: 개인건강정보 수정
      description: 전달한 필드만 부분 수정한다. 전부 선택 입력이며 회원가입 흐름과 무관하게 언제든 호출할 수 있다. 가입 시 나이/성별을 안 받으므로, 여기서 처음 입력받는 경우가 일반적이다. diagnosis_history/family_history에
        빈 리스트를 보내면 전부 지워진다.
      operationId: update_health_info_api_v1_users_me_health_info_patch
      requestBody:
        content:
          application/json:
            schema:
