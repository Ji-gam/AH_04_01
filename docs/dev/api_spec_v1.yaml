    FoodInteractionCheckResult:
      properties:
        guide_cards:
          items:
            $ref: '#/components/schemas/GuideCard'
          type: array
          title: Guide Cards
          default: []
        checked_count:
          type: integer
          title: Checked Count
        pending_medication_names:
          items:
            type: string
          type: array
          title: Pending Medication Names
          default: []
      type: object
      required:
      - checked_count
      title: FoodInteractionCheckResult
      description: '(T-DOC-2) 등록된 모든 약 기준으로 음식/음주 주의사항을 모아온 결과.


        confirm_recognition_job의 guide_cards(문서 등록 확정 직후 1회성 안내)와 달리, 이 결과는

        등록 방식(OCR/수동 등록)과 무관하게 "음식(13번)" 탭을 열 때마다 현재 등록약 전체를 대상으로

        조회한다.


        (T-DOC-5) `/medications/food-interactions`는 빠른 1,2단계(식약처 참조 테이블 → MySQL

        `drugs_data` 스냅샷)만으로 응답한다 — `pending_medication_names`에 담긴 약은 아직 확인되지

        않은 것이며, 느린 3단계(실시간 e약은요 API)로 확인하려면 `/medications/food-interactions/pending`을

        별도로 호출해야 한다. 그 응답의 `guide_cards`에는 `pending_medication_names`가 없다(모두

        확인이 끝난 상태이므로).'
    FoodItem:
      properties:
        name:
          type: string
          title: Name
        detail:
          type: string
          title: Detail
        polarity:
          type: string
          title: Polarity
          default: avoid
      type: object
      required:
      - name
      - detail
      title: FoodItem
      description: "(T-DOC-4) 음식 상호작용 안내 카드에서 원문 전체를 줄글로 보여주는 대신, 음식명 칩을 먼저\n보여주고 클릭 시 이 음식에 대한 상세(detail)만 펼쳐볼 수 있게 하기 위한\
        \ 단위.\n\n(2026-07-15) `polarity`: 원문이 이 음식을 무조건 \"피하라\"는 게 아닌 경우가 있어 세 가지로\n나눈다.\n- \"avoid\"(기본값): 함께 섭취를 피해야 함(회피\
        \ 방법이 없거나 언급되지 않음).\n- \"recommend\": 오히려 이 약과 함께/식후에 먹으면 좋다는 권장(예: NSAIDs/리튬 + 우유 —\n  위장장애 완화 목적).\n- \"timing_caution\"\
        : 동시 섭취는 피해야 하지만, 복용 시간과 일정 간격(1~2시간 등)만 두면\n  섭취해도 된다는 구체적인 시차 요령이 있는 경우(예: 자몽주스+칼슘채널차단제 — 복용 후\n  2시간 뒤엔 마셔도 됨).\n\
        규칙 기반 추출은 문장에 음식명이 등장하는지만 보고 이런 맥락을 판단하지 못하므로, 자동\n분류 대신 식약처 참조 테이블 빌드 시 사람이 원문을 직접 읽고 확인한 소수의 예외만\n\"recommend\"\
        /\"timing_caution\"으로 표시한다(`build_food_drug_interaction_db.py`의\n`_RECOMMEND_OVERRIDES`/`_TIMING_CAUTION_OVERRIDES`).\
        \ 그 외는 전부 기본값 \"avoid\" — 잘못\n분류해 실제로 피해야 할 음식을 안전한 것처럼 보여주는 쪽이, 그 반대보다 훨씬 위험하므로\n안전한 기본값을 택했다."
