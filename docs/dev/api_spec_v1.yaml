          description: 오늘 기록(아직 없으면 null)
        reference_hours:
          type: integer
          title: Reference Hours
          description: 비교 기준 수면시간 - 일반 권장량(8) 고정
      type: object
      required:
      - log
      - reference_hours
      title: SleepTodayResult
    TokenRefreshResponse:
      properties:
        access_token:
          type: string
          title: Access Token
          description: 'Authorization: Bearer 헤더에 담아 보낸다. Refresh Token은 이 응답이 아니라 httpOnly 쿠키로 내려간다.'
      type: object
      required:
      - access_token
      title: TokenRefreshResponse
    TopDrugItem:
      properties:
        name:
          type: string
          title: Name
          description: 약품명.
        count:
          type: integer
          title: Count
          description: 등록 건수.
      type: object
      required:
      - name
      - count
      title: TopDrugItem
    TrendPoint:
      properties:
        date:
          type: string
          title: Date
          description: YYYY-MM-DD 형식 날짜.
        count:
          type: integer
          title: Count
          description: 그 날짜의 건수.
      type: object
      required:
      - date
      - count
      title: TrendPoint
    UserInfoResponse:
      properties:
        id:
          type: integer
          title: Id
          description: User(계정)의 PK.
        profile_id:
          type: integer
          title: Profile Id
          description: Profile(개인정보)의 PK. 앞으로 추가되는 도메인 API는 이 값을 기준으로 조회/저장한다.
        name:
          type: string
          title: Name
          description: Profile에 저장된 이름(닉네임).
        email:
          type: string
          title: Email
          description: User(계정)의 로그인 이메일. 가입 후 변경 불가.
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: Profile에 저장된 휴대폰번호. 미입력 시 null.
        gender:
          anyOf:
          - $ref: '#/components/schemas/Gender'
          - type: 'null'
          description: Profile에 저장된 성별. 미입력 시 null.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: User(계정) 생성 시각.
        is_admin:
          type: boolean
          title: Is Admin
          description: 관리자 여부 - 프론트에서 관리자 메뉴 노출 여부에만 씀(실제 권한검증은 서버가 함).
          default: false
        health_info_consented_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Health Info Consented At
          description: 개인건강정보 동의 시각.
        ai_chat_consented_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ai Chat Consented At
          description: AI 챗봇 데이터 활용 동의 시각.
        terms_of_service_consented_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Terms Of Service Consented At
          description: 이용약관 동의 시각.
        marketing_consented_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Marketing Consented At
          description: 마케팅 정보 수신 동의 시각(선택).
        has_password:
          type: boolean
          title: Has Password
          description: 비밀번호 보유 여부. 소셜 가입자는 false.
          default: true
      type: object
      required:
      - id
      - profile_id
      - name
      - email
      - phone_number
      - gender
      - created_at
      title: UserInfoResponse
    UserUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 20
            minLength: 2
          - type: 'null'
          title: Name
          description: Profile의 이름(닉네임)
          examples:
          - 길동이
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: 'Available Format: +8201011112222, 01011112222, 010-1111-2222'
        gender:
          anyOf:
          - $ref: '#/components/schemas/Gender'
          - type: 'null'
          description: '''MALE'' or ''FEMALE'''
      type: object
      title: UserUpdateRequest
      description: '전달한 필드만 갱신한다(부분 수정). 전부 Profile에 반영된다.

        email은 로그인 식별자라 여기서 수정할 수 없다(가입 후 고정) - 이메일 인증 절차가 없는 상태에서

        검증 없이 바꾸면 계정을 잃어버릴 위험이 있어서, 실서비스 전환 시 이메일 인증 기능과 함께 재검토한다.

        [변경] 생년월일은 더 이상 안 쓴다 - 나이는 더보기 > 개인건강정보에서 관리한다.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VapidPublicKeyResult:
      properties:
        public_key:
          type: string
          title: Public Key
      type: object
      required:
      - public_key
      title: VapidPublicKeyResult
    WeeklyReportItemResult:
      properties:
        id:
          type: integer
          title: Id
          description: 리포트 id
        week_start_date:
          type: string
          format: date
          title: Week Start Date
          description: 집계 시작일(월요일)
        week_end_date:
          type: string
          format: date
          title: Week End Date
          description: 집계 종료일(일요일)
        content:
          type: string
          title: Content
          description: AI가 작성한(또는 폴백 템플릿) 주간 리포트 본문
        created_at:
          type: string
          format: date-time
          title: Created At
          description: 생성 시각
      type: object
      required:
      - id
      - week_start_date
      - week_end_date
      - content
      - created_at
      title: WeeklyReportItemResult
    WeeklyReportListResult:
      properties:
        reports:
          items:
            $ref: '#/components/schemas/WeeklyReportItemResult'
          type: array
          title: Reports
          description: 저장된 주간 리포트 목록(최신순)
      type: object
      required:
      - reports
      title: WeeklyReportListResult
    WithdrawRequest:
      properties:
        password:
          anyOf:
          - type: string
            minLength: 8
          - type: 'null'
          title: Password
          description: 본인 확인용 현재 비밀번호. 소셜 가입자는 비밀번호가 없어 생략 가능.
          examples:
          - Password123!
      type: object
      title: WithdrawRequest
      description: '회원탈퇴 - 탈취된 토큰만으로 탈퇴되는 것을 막기 위해 현재 비밀번호 재확인을 요구한다.

        소셜 가입자는 비밀번호가 없어서 이 재확인 자체가 불가능했던 문제(2026-07-28 발견)를

        고치면서, 소셜 계정은 비밀번호 없이도(None/미전달) 탈퇴할 수 있게 함 - 서비스가 다시

        소셜 재인증(OAuth 재로그인)까지 요구하는 건 이번엔 범위 밖이라, 유효한 토큰만으로

        탈퇴 가능한 수준으로 우선 풀어둠(이메일 가입자는 기존과 동일하게 비밀번호 필수).'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
tags:
- name: auth
  description: 회원가입/로그인/토큰 재발급. Access Token은 응답 body로, Refresh Token은 httpOnly 쿠키로 내려간다.
- name: users
  description: 로그인한 계정(User)의 정보 조회/수정. 개인정보(이름/성별/생일/휴대폰번호)는 Profile 기준으로 응답한다.
- name: notifications
  description: 복약 알림 일정(Notification Schedule) CRUD. profile_id 기준으로 스코핑한다.
servers:
- url: http://localhost:8000
  description: 로컬 개발
- url: https://api.remedi.app
  description: 운영(예정)
