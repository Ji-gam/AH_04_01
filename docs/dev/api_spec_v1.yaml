  /api/v1/contents/generate:
    post:
      tags:
      - Content
      summary: '[관리자] 건강 콘텐츠 생성'
      description: 실제로 ai_worker의 `/generate-structured`(LLM 생성)를 호출해 콘텐츠 카드 1건을 만들고 `health_contents`에 즉시 저장한다(더보기 > 관리자
        컨텐츠생성 화면 전용). 저장된 카드는 "정보" 탭(`GET /contents/me`)에도 그대로 반영된다 — 오프라인 배치 생성(`generate_health_content.py`)을 보완하는 온라인 단건
        생성 경로다. disease_code/category/topic을 생략하면 서버가 무작위로 고른다. 같은 (질환, 카테고리, 오늘 날짜) 캐시가 있으면 새로 만들지 않고 그 카드를 갱신한다. [2026-07-27]
        원래 인증 자체가 전혀 없어서(로그인조차 불필요) 아무나 LLM 생성을 트리거해 비용을 유발하고 전체 사용자가 보는 콘텐츠를 바꿀 수 있던 문제를 막기 위해 get_current_admin_user 추가함.
        이 행위는 admin_actions에 감사로그로 남는다.
      operationId: generate_content_api_v1_contents_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthContentResponse'
        '503':
          description: 'ai_worker가 응답하지 않거나 생성 불가 상태(예: API 키 미설정).'
        '400':
          description: ai_worker에 잘못된 생성 요청을 보냄(내부 버그 가능성).
        '502':
          description: ai_worker 응답은 왔으나 형식이 예상과 다름.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
