<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Re:Medi</title>

    <!-- PWA - manifest.json은 앱 이름/아이콘/테마색/시작화면 배경색을 정의한다.
         (frontend/public/manifest.json, 2026-07-21) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF6F91" />

    <!-- iOS는 manifest.json을 일부만 인식해서(홈 화면 아이콘/독립 실행 여부 등은 못 읽음)
         아래 애플 전용 메타태그로 따로 알려줘야 한다. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Re:Medi" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
