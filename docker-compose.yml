services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
    # ${환경변수명} 문법은 OS 환경변수 혹은 .env에서 해당 환경변수명과 일치하는 항목이 있으면 대입합니다.
    # 반드시 사전에 .env에 해당 항목이 존재하는지 확인해야 합니다.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: 'Asia/Seoul'
    ports:
      - ${DB_EXPOSE_PORT}:${DB_PORT}
    networks:
      - ws
    volumes:
      - mysql_data:/var/lib/mysql  # 컨테이너가 삭제돼도 데이터는 호스트 파일시스템에 남음
      - ./infra/mysql/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh  # pytest용 test DB 자동 생성(볼륨 최초 초기화 시 1회)
    command: # 한글 저장을 위한 문자셋 설정 (필수!)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --port=${DB_PORT}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    build:
      context: .  # 프로젝트 루트를 빌드 컨텍스트로 지정
      dockerfile: app/Dockerfile  # Dockerfile 위치 지정
      platforms:
        - linux/amd64
        - linux/arm64
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}  # APP_VERSION은 빌드된 이미지의 버전관리를 위함입니다. v1.0.0 형식으로 사용합니다.
    env_file: .env
    environment:
      # .env의 DB_HOST=localhost는 로컬 venv로 fastapi를 직접 실행할 때 기준 값이다.
      # 도커 컨테이너 안에서는 localhost가 fastapi 컨테이너 자기 자신을 가리켜서 mysql 컨테이너를
      # 못 찾는다 - 그래서 여기서 mysql(서비스명)로 덮어써야 한다. 여러 명이 겪고 확인한 이슈.
      DB_HOST: mysql
    command: |
      sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app  # 로컬의 app 디렉토리를 컨테이너의 /app/app에 마운트(수정사항 즉시 반영)
      - static_volume:/app/templates
      # REQ-DOC-003: 처방전/약봉투/진료기록 원본 이미지(암호화 저장) 전용 프라이빗 볼륨.
      # fastapi에만 마운트하고 nginx/ai-worker에는 마운트하지 않는다 - 웹에서 직접 정적
      # 서빙되지 않고 반드시 인증된 API(/recognition/jobs/{job_id}/image)를 통해서만 접근된다.
      - document_storage:/app/private_media
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. AI Worker (Model 학습 및 추론)
  ai-worker:
    container_name: ai-worker
    build:
      context: .  # 프로젝트 루트를 빌드 컨텍스트로 지정
      dockerfile: ai_worker/Dockerfile  # Dockerfile 위치 지정
      platforms:
        - linux/amd64
        - linux/arm64
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}  # AI_WORKER_VERSION은 빌드된 이미지의 버전관리를 위함입니다. V1.0.0 형식으로 사용합니다.
    env_file: .env
    restart: always
    mem_limit: 4G
    ports:
      - "8001:8001"
    volumes:
      - ./ai_worker:/app/ai_worker
      - /app/.venv
      # 임베딩 모델(e5-large, 2.2GB) 캐시. **이름있는 볼륨이어야 한다** — 위 /app/.venv처럼
      # 익명으로 두면 컨테이너 재생성 때 같이 버려져 매번 2GB를 다시 받는다(기동 3~4분).
      # 이름을 주면 컨테이너와 수명이 분리돼 재생성·리빌드를 견딘다(down -v면 날아감).
      - hf_cache:/root/.cache/huggingface
      # RAG 벡터스토어(ai_worker/ingest가 만든 chroma_data) - 위 ./ai_worker 바인드 마운트가
      # 로컬 소스코드 전체를 덮어써서 chroma_data도 호스트의 ai_worker/chroma_data(.gitignore)로
      # 자동으로 영속화된다. prod(EC2)는 소스 바인드 마운트가 없어 이 볼륨이 별도로 필요하다
      # (infra/docker/docker-compose.prod.yml 참고, 2026-07-22 EC2 장애로 확인됨).
    networks:
      - ws
    command: |
      sh -c "uv run uvicorn ai_worker.main:app --host 0.0.0.0 --port 8001 --reload"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
    ports:
      - "80:80"
    networks:
      - ws
    depends_on:
      - fastapi

volumes:
  mysql_data:
  static_volume:
  hf_cache:
  document_storage:

networks:
  ws:
    driver: bridge
