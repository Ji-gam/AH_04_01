services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
    # ${환경변수명} 문법은 OS 환경변수 혹은 .env에서 해당 환경변수명과 일치하는 항목이 있으면 대입합니다.
    # 반드시 사전에 .env에 해당 항목이 존재하는지 확인해야 합니다.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - ${DB_EXPOSE_PORT}:${DB_PORT}
    networks:
      - ws
    volumes:
      - mysql_data:/var/lib/mysql  # 컨테이너가 삭제돼도 데이터는 호스트 파일시스템에 남음
    command: # 한글 저장을 위한 문자셋 설정 (필수!)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --port=${DB_PORT}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}  # APP_VERSION은 빌드된 이미지의 버전관리를 위함입니다. v1.0.0 형식으로 사용합니다.
    env_file: .env
    volumes:
      - static_volume:/app/templates
      - media_volume:/app/media
      # REQ-DOC-003: 처방전/약봉투/진료기록 원본 이미지(암호화 저장) 전용 프라이빗 볼륨.
      # media_volume과 달리 nginx/certbot 어디에도 마운트하지 않는다 - media_volume은
      # nginx의 /vol/web/media로도 마운트되어 정적 서빙되지만, 이 볼륨은 fastapi에만
      # 마운트해 인증된 API를 거치지 않으면 절대 노출되지 않게 한다.
      - document_storage:/app/private_media
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. AI Worker (Model 학습 및 추론)
  ai-worker:
    container_name: ai-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}  # AI_WORKER_VERSION은 빌드된 이미지의 버전관리를 위함입니다. V1.0.0 형식으로 사용합니다.
    env_file: .env
    restart: always
    mem_limit: 4G
    volumes:
      # RAG 벡터스토어(ai_worker/ingest가 만든 chroma_data). 이름있는 볼륨이어야 컨테이너
      # 재생성(재배포/OOM 재시작 등)을 견딘다 - 볼륨 없이는 재생성마다 색인이 통째로
      # 사라져 매번 수동으로 다시 인제스트해야 한다(2026-07-22 EC2 장애로 확인됨).
      - chroma_data:/app/ai_worker/chroma_data
      # export_source_from_mysql.py가 만드는 DUR CSV 9개. 컨테이너 이미지엔 안 들어있고
      # (.gitignore, 빌드 산출물) 런타임에 컨테이너 쓰기 계층에만 생기는데, 이름있는
      # 볼륨이 아니면 다른 서비스 배포로 컨테이너가 재생성될 때마다 통째로 사라져
      # export/ingest를 처음부터 다시 해야 한다(2026-07-28 확인).
      - ai_worker_source:/app/ai_worker/source
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ws
    depends_on:
      - fastapi

  # 6. certbot: SSL 인증서 발급담당
  certbot:
    image: certbot/certbot
    container_name: auto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  mysql_data:
    name: mysql_data
  static_volume:
    name: static_volume
  media_volume:
    name: media_volume
  certbot-conf:
    name: certbot-conf
  certbot-www:
    name: certbot-www
  chroma_data:
    name: chroma_data
  document_storage:
    name: document_storage
  ai_worker_source:
    name: ai_worker_source

networks:
  ws:
    name: ws
    driver: bridge
